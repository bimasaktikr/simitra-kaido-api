version: "3.9"

services:
  postgres:
    image: postgres:17.6
    container_name: simitra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mitra_kaido}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-mitra123}
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "postgres"
      - "-c"
      - "password_encryption=md5"
      - "-c"
      - "checkpoint_timeout=15min"
      - "-c"
      - "log_checkpoints=off"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "logging_collector=off"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "tcp_keepalives_idle=60"
      - "-c"
      - "tcp_keepalives_interval=10"
      - "-c"
      - "tcp_keepalives_count=6"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
      - ./sql/init-ml-tables.sql:/docker-entrypoint-initdb.d/init-ml-tables.sql:ro
    networks:
      - simitra_shared_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mitra_kaido}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 30s
    stop_signal: SIGTERM
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s

volumes:
  postgres_data:
    driver: local
    name: simitra_postgres_data

networks:
  simitra_shared_network:
    driver: bridge
    name: simitra_shared_network
